<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOZA | Service Verification</title>
    <meta
      name="description"
      content="MOZA는 라페니체에스티오에서 개발 및 운영하는 서비스입니다."
    />
    <style>
      :root {
        --bg-1: #f8f7f2;
        --bg-2: #ebe8dd;
        --text: #1f1f1c;
        --muted: #5c5a52;
        --card: rgba(255, 255, 255, 0.78);
        --line: rgba(31, 31, 28, 0.15);
        --accent: #214b3b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        color: var(--text);
        min-height: 100vh;
        background:
          radial-gradient(
            1000px 500px at 10% -10%,
            #fffdf5 0%,
            transparent 65%
          ),
          radial-gradient(
            1000px 700px at 120% 120%,
            #dde8e1 0%,
            transparent 55%
          ),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(820px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 32px;
        backdrop-filter: blur(4px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 6vw, 64px);
        letter-spacing: 0.04em;
        color: var(--accent);
        line-height: 1;
      }

      .subtitle {
        margin: 14px 0 0;
        font-size: clamp(15px, 2.3vw, 20px);
        color: var(--muted);
        line-height: 1.6;
      }

      .grid {
        margin-top: 28px;
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 10px 18px;
        font-size: clamp(14px, 2vw, 17px);
        line-height: 1.75;
      }

      .label {
        font-weight: 700;
        color: #2f2f2a;
      }

      .value {
        color: #2f2f2a;
        word-break: break-word;
      }

      .footer {
        margin-top: 26px;
        padding-top: 16px;
        border-top: 1px dashed var(--line);
        font-size: 13px;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .card {
          padding: 24px 20px;
        }
        .grid {
          grid-template-columns: 1fr;
          gap: 4px 0;
        }
        .label {
          margin-top: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-label="MOZA 서비스 소개">
      <h1>MOZA</h1>
      <p class="subtitle">
        MOZA는 라페니체에스티오에서 개발 및 운영하는 서비스입니다.
      </p>

      <section class="grid" aria-label="회사 정보">
        <div class="label">Company</div>
        <div class="value">(주)라페니체에스티오</div>

        <div class="label">Business Registration</div>
        <div class="value">사업자번호 620-88-02659</div>

        <div class="label">Contact</div>
        <div class="value"><a href="mailto:@moza.im">info@moza.im</a></div>
      </section>

      <div class="footer">
        This page is provided for service and project verification purposes.
      </div>
    </main>
  </body>
</html>
